<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your password was changed</title></head>
  <body style="margin:0;background:#f7f7f7;font-family:Helvetica,Arial,sans-serif;color:#25232b;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;">
      <tr><td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;">
          <tr><td style="padding:28px 36px;background:#00bcd4;color:#ffffff;"><strong style="font-size:24px;">Phoenix</strong></td></tr>
          <tr><td style="padding:32px 36px;line-height:1.55;">
            <h1 style="margin:0 0 18px;font-size:24px;">Your password was changed</h1>
            <p>Hello {firstName},</p>
            <p>Your Phoenix account password was changed.</p>
            <p>If you made this change, no action is needed. If you did not, reset your password immediately and contact the operator of this server.</p>
            <p><a href="{portalUrl}" style="color:#007f92;">Open Phoenix</a></p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
