<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your email has changed</title>
</head>
<body style="font-family: Helvetica, Arial, sans-serif; margin:0;">
  <table width="100%" border="0" cellspacing="0" cellpadding="0" style="border-collapse: collapse; border-spacing: 0;">
    <tr>
        <td align="center" style="background-color:#00d4f0;width: 100%;height: 101px;">
          <img alt="jibo" src="https://s3.amazonaws.com/com.jibo.assets/email_templates_assets/jibo_logo.png"/>
        </td>
    </tr>
    <tr>
      <td align="center" style="padding-top:1.2em;">
        <h2 style="color:  #000000;font-size: 34.99px;font-weight: 700;line-height: 18px;text-align: center;">
          Your email has changed
        </h2>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding-bottom:1.2em;">
        <h4 style="width:526px;color:#5c5b6b;font-size: 18px;font-weight: 300;line-height: 27px;text-align: center;">
          <span>We recently received a request to change <br/> your Jibo account's email address.</span>
        </h4>
        <h4 style="width:526px;color:#5c5b6b;font-size: 18px;font-weight: 300;line-height: 27px;text-align: center;">
          <span>Previous email: <b>{originalEmail}</b></span>
          <br/>
          <span>New email: <b>{newEmailAddress}</b></span>
        </h4>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding-bottom:1.2em;">
        <div style="width:270px;height:34px;color:  #5c5b6b;font-size: 13px;font-weight: 300;line-height: 20px;text-align: center;">
          If you didn't request this change, contact Jibo Customer care at <a href="mailto:support@jibo.com" style="color: #00d4f0;font-size: 13px;font-weight: 700;line-height: 20px;text-align: center;">support@jibo.com.</a>
        </div>
      </td>
    </tr>
    <tr>
      <td align="center">
        <img width="237" height="152" style="display: block; margin-top:3em;" alt="jibo" src="https://s3.amazonaws.com/com.jibo.assets/email_templates_assets/account_confirm.png" />
      </td>
    </tr>
    <tr>
      <td align="center">
        <div style="margin:0 auto; padding-bottom:1.2em; background-color:  #f7f7f7;width: 100%;height: 62px;position:relative">
          <p style="margin: 0; padding-top: 2em; color:  #00d4f0;font-size: 13px;font-weight: 700;line-height: 20px;text-align: center;">
            Jibo, Inc.
          </p>
          <div style="margin:0; color:  #5c5b6b;font-size: 13px;font-weight: 300;line-height: 20px;text-align: center;">
            <p style="margin:0;">&copy; 2017 Jibo, Inc. All rights reserved.</p>
          </div>
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
