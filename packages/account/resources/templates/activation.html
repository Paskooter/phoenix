<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Activation</title>
</head>
<body style="font-family: Helvetica, Arial, sans-serif; margin:0;">
  <table width="100%" border="0" cellspacing="0" cellpadding="0" style="border-collapse: collapse; border-spacing: 0;">
    <tr>
        <td align="center" style="background-color:#00d4f0;width: 100%;height: 101px;">
          <img  alt="jibo" src="https://s3.amazonaws.com/com.jibo.assets/email_templates_assets/jibo_logo.png"/>
        </td>
    </tr>
    <tr>
      <td align="center" style="padding-top:1.2em;padding-bottom:1.2em">
        <h2 style="color:  #000000;font-size: 30px;font-weight: 700;line-height: 18px;text-align: center;">
          Hey {firstName}!
        </h2>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding-bottom:1.2em;">
        <h4 style="width:346px;color:  #5c5b6b;font-size: 18px;font-weight: 300;line-height: 27px;text-align: center;">
          Thank you for creating an account. Please click the button below to get started! This works best while using a mobile device.
        </h4>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding-bottom:1.2em;">
        <div style="display:table-cell;vertical-align:middle;border: none;border-radius: 2em;background-color:  #00d4f0;width: 341px;height: 71px;">
          <a style="display: block; width: 341px; color: #ffffff; font-size: 22.4px; font-weight: 400; line-height: 18px;text-align: center; text-decoration: none;" href="{url}">Confirm my account</a>
        </div>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding-bottom:1.2em;">
        <div style="width:239px;height:34px;color:  #5c5b6b;font-size: 13px;font-weight: 300;line-height: 20px;text-align: center;">
          If you didn't make an account with Jibo, feel free to just ignore this email.
        </div>
      </td>
    </tr>
    <tr>
      <td align="center">
        <img width="237" height="152" alt="jibo" style="display: block" src="https://s3.amazonaws.com/com.jibo.assets/email_templates_assets/account_confirm.png" />
      </td>
    </tr>
    <tr>
      <td align="center">
        <div style="margin:0 auto; padding-bottom:1.2em; background-color:  #f7f7f7;width: 100%;height: 62px;position:relative">
          <p style="margin: 0; padding-top: 2em; color:  #00d4f0;font-size: 13px;font-weight: 700;line-height: 20px;text-align: center;">
            Jibo, Inc.
          </p>
          <div style="margin:0; color:  #5c5b6b;font-size: 13px;font-weight: 300;line-height: 20px;text-align: center;">
            <p style="margin:0;">&copy; 2017 Jibo, Inc. All rights reserved.</p>
          </div>
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
