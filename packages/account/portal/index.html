<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jibo — Phoenix</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🤖 Phoenix <span class="sub">Jibo portal</span></h1>
    <div id="who-box" class="who" hidden>
      <span id="who"></span>
      <button id="logout" class="link">Log out</button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" hidden>
      <nav>
        <a href="#/" data-route="home">Home</a>
        <a href="#/loop" data-route="loop">Loop &amp; people</a>
        <a href="#/settings" data-route="settings">Personal report</a>
        <a href="#/profile" data-route="profile">Account</a>
        <a href="#/robot" data-route="robot">Robot</a>
        <a href="#/gallery" data-route="gallery">Gallery</a>
        <a href="#/messaging" data-route="messaging">Messages</a>
        <a href="#/system" data-route="system">System</a>
      </nav>
    </aside>
    <main id="app"><p class="muted">Loading…</p></main>
  </div>

  <!-- AUTH -->
  <template id="tpl-auth">
    <section class="card narrow">
      <div class="tabs">
        <button data-tab="login" class="tab active">Log in</button>
        <button data-tab="signup" class="tab">Sign up</button>
      </div>
      <form id="auth-form">
        <label>Email<input name="email" type="email" autocomplete="email" required /></label>
        <label class="signup-only" hidden>First name<input name="firstName" type="text" autocomplete="given-name" /></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" minlength="8" required /></label>
        <p class="error" id="auth-error" hidden></p>
        <button type="submit" class="primary" id="auth-submit">Log in</button>
      </form>
      <p class="muted">Use the same account you sign into the Jibo app with.</p>
    </section>
  </template>

  <script type="module" src="/app.js"></script>
</body>
</html>
