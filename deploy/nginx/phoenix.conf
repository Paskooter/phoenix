# Phoenix — nginx: serve the site and console as static files, proxy the API.
#
#   /                     -> static files from the portal directory
#   /app, /admin          -> the console shell (one file, hash-routed)
#   /terms /privacy       -> static legal pages
#   /api/ ...             -> reverse-proxied to the account service
#
# Why split it this way: the pages are plain files with no build step, so nginx
# can serve them directly and the Node process only ever handles API calls. The
# account service can still serve everything itself (that is what it does on a
# bare `npm run start:account`) — this file is for putting a real front door on
# it.
#
# Install:
#   sudo cp deploy/nginx/phoenix.conf /etc/nginx/sites-available/phoenix
#   sudo ln -s /etc/nginx/sites-available/phoenix /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Before it will work, change:
#   - server_name           to your hostname
#   - root                  to where this checkout lives
#   - ssl_certificate*      to your certificate paths
#   - the upstream port     if the account service is not on 7016

upstream phoenix_account {
    # The account service. Keep it bound to localhost — nothing should reach it
    # except through this proxy.
    server 127.0.0.1:7016;
    keepalive 16;
}

# Rate-limit buckets. The application has no brute-force lockout of its own, so
# this is where sign-in gets protected. See /security on the site.
limit_req_zone $binary_remote_addr zone=phoenix_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=phoenix_api:10m  rate=60r/s;

# ---------------------------------------------------------------------------
# HTTP -> HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name phoenix.example.com;

    # Leave ACME reachable over plain HTTP so certificate renewal works.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# The site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name phoenix.example.com;

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/phoenix.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phoenix.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:phoenix_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Security headers --------------------------------------------------
    # The site loads no third-party script, style, font or frame, so the policy
    # can be strict. Two deliberate exceptions, both in the console only:
    #   img-src  OpenStreetMap tiles, for the commute location picker
    #   connect-src  the Nominatim search the picker uses to resolve an address
    # Drop those two if you do not want the picker reaching outside at all; it
    # degrades to manual latitude/longitude entry.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://nominatim.openstreetmap.org; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), interest-cohort=()" always;

    # The inline 'unsafe-inline' for script-src covers the small theme script in
    # each page <head>, which has to run before first paint to avoid a flash of
    # the wrong theme. Replace it with a nonce or a hash if you would rather not
    # allow inline script at all.

    # --- Static root -------------------------------------------------------
    root /srv/phoenix/packages/account/portal;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml application/xml;

    # --- API ---------------------------------------------------------------
    # Everything the browser calls at /api goes to the account service. The
    # session cookie rides along unchanged because this is the same origin.
    location /api/ {
        limit_req zone=phoenix_api burst=120 nodelay;
        proxy_pass http://phoenix_account;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;   # media blobs stream through this path
    }

    # Sign-in and sign-up get the tighter bucket. There is no application-level
    # lockout behind them.
    #
    # The proxy headers are written out in each block rather than pulled from
    # /etc/nginx/proxy_params, which only exists on Debian-family installs.
    location = /api/login {
        limit_req zone=phoenix_auth burst=5 nodelay;
        proxy_pass http://phoenix_account;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/signup {
        limit_req zone=phoenix_auth burst=5 nodelay;
        proxy_pass http://phoenix_account;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The admin surface is password-gated by the application, but it has no
    # business being reachable from the open internet. Restrict it by address
    # as well — adjust or remove for your own network.
    location /api/admin/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://phoenix_account;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        try_files /app.html =404;
    }

    # Member photos are streamed by the account service, not served from disk.
    location /member-photos/ {
        proxy_pass http://phoenix_account;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # --- Pages -------------------------------------------------------------
    # Extensionless URLs map to their file. The console is one shell for every
    # hash route beneath it.
    location = /        { try_files /index.html =404; }
    location = /app     { try_files /app.html =404; }
    location = /terms   { try_files /terms.html =404; }
    location = /privacy { try_files /privacy.html =404; }
    location = /security{ try_files /security.html =404; }

    # Branding: if you keep an operator override outside the checkout, point
    # this alias at it so nginx serves yours instead of the shipped defaults.
    # (The account service reads PHOENIX_BRANDING_FILE for the same purpose.)
    # location = /branding.json { alias /etc/phoenix/branding.json; }

    # HTML and the branding file are not content-hashed, so they must always be
    # revalidated or an upgrade leaves stale pages in browsers.
    location ~* \.(?:html|json|webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Neither are the CSS and JS, so they get the same treatment. If you ever
    # add a build step that fingerprints filenames, this is the block to change
    # to `immutable`.
    location ~* \.(?:css|js|mjs)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Images and fonts are stable enough to cache hard.
    location ~* \.(?:svg|png|jpg|jpeg|webp|avif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Never serve the vendored source maps or dotfiles.
    location ~ /\.          { deny all; }
    location ~ \.map$       { deny all; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
