# Phoenix public health check: http-context part of deploy/nginx/phoenix-health.conf.
# Install in /etc/nginx/conf.d/ (http context), once per host.
#
# $msec is "<unix seconds>.<millis>". Dropping the last digit of the seconds
# gives the current 10-second slot, the same number scripts/planned-restart-window.sh
# uses to name the planned-restart window files (window-<slot>.json).
map $msec $phoenix_restart_slot {
    default "none";
    "~^(?<phoenix_slot>\d+)\d\." $phoenix_slot;
}
