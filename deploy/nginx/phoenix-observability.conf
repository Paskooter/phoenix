# Install in /etc/nginx/conf.d/ (http context). In each Phoenix server block:
#   access_log /var/log/nginx/phoenix/access.log phoenix_observability;
#   error_log /var/log/nginx/phoenix/error.log warn;
# Create that directory first, and install deploy/logrotate/phoenix-nginx.
# Keep this separate from unrelated virtual hosts on a shared server.
map $http_x_amz_target $phoenix_log_operation {
    default "";
    "~^[A-Za-z][A-Za-z0-9_]{0,63}\.[A-Za-z][A-Za-z0-9_]{0,63}$" $http_x_amz_target;
}

# No request bodies, authorization, cookies, query strings, or client addresses.
log_format phoenix_observability escape=json
    '{"t":"$time_iso8601","host":"$host","method":"$request_method",'
    '"path":"$uri","operation":"$phoenix_log_operation","status":$status,'
    '"upstreamStatus":"$upstream_status","requestSeconds":$request_time,'
    '"upstreamSeconds":"$upstream_response_time","bytes":$body_bytes_sent}';
