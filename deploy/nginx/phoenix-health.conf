# Phoenix public health check for outside uptime monitors: GET /health.
#
# Include this inside the site's HTTPS server block (server context), next to
# the other locations that proxy to the account service:
#
#     include snippets/phoenix-health.conf;
#
# It needs the `phoenix_account` upstream that deploy/nginx/phoenix.conf and
# docs/DEPLOYMENT.md already define, and the `$phoenix_restart_slot` map from
# deploy/nginx/phoenix-health-http.conf (http context, e.g. /etc/nginx/conf.d/).
#
# Normally nginx forwards /health to the account service, which answers
# {"status":"ok"}. When the account service cannot answer (connection refused,
# a timeout, or a 502/503/504), nginx looks for the planned-restart window that
# scripts/activate-native-release.sh opens with scripts/planned-restart-window.sh
# just before it restarts the service:
#
#   - inside that window (about 60 s) it answers 200 {"status":"ok","restarting":true};
#   - otherwise it answers 503 {"status":"down"}.
#
# The window is a set of files named after 10-second slots of the clock
# (window-<unix time / 10>.json). nginx only ever serves the file for the
# CURRENT slot, so the window ends by itself 60-70 s after the restart began
# even if nothing closes it: a release that never comes back, or a crash
# outside a planned restart, is reported down honestly. The deploy script
# deletes the files as soon as the restarted service passes its health checks.
#
# Install (operator step, needs root; not part of a release activation):
#   sudo install -m 0644 deploy/nginx/phoenix-health-http.conf /etc/nginx/conf.d/phoenix-health-http.conf
#   sudo install -m 0644 deploy/nginx/phoenix-health.conf /etc/nginx/snippets/phoenix-health.conf
#   add the include line above to the site's HTTPS server block
#   sudo nginx -t && sudo systemctl reload nginx
# The window directory must match PHOENIX_RESTART_WINDOW_DIR used by the deploy
# script (default /run/phoenix-restart; created there on the first planned
# restart, mode 0755, files 0644 so nginx workers can read them).

location = /health {
    proxy_pass http://phoenix_account;
    # A monitor should hear about a hung service quickly, not after the long
    # API timeouts the rest of the site uses.
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @phoenix_health_unavailable;
}

location @phoenix_health_unavailable {
    root /run/phoenix-restart;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    # No `if` here: an `if` block would drop try_files and answer 404.
    try_files /window-$phoenix_restart_slot.json @phoenix_health_down;
}

location @phoenix_health_down {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"status":"down"}\n';
}
