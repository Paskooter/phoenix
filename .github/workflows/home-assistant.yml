name: Home Assistant connector
on:
  push:
    paths:
      - "packages/account/**"
      - "packages/gateway/**"
      - "packages/skills/src/homeAssistantSkill.js"
      - "scripts/home-assistant/**"
      - ".github/workflows/home-assistant.yml"
  pull_request:
    paths:
      - "packages/account/**"
      - "packages/gateway/**"
      - "packages/skills/src/homeAssistantSkill.js"
      - "scripts/home-assistant/**"
      - ".github/workflows/home-assistant.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: node --test packages/account/test/homeAssistant.test.js packages/gateway/test/homeAssistant.test.js
      - run: npx playwright install --with-deps chromium
      - run: node scripts/home-assistant/portal-smoke.mjs
